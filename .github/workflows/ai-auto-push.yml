name: AI Auto Push - Meta AI Builders
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python scripts/check_parity.py
      - run: cd backend && python scripts/security_guardian.py
      - run: cd backend && pytest -v
